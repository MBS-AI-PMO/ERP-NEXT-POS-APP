# Local TEST copy of the live ERPNext (same Docker image as live).
# Start:  docker compose -p erptest --env-file .env up -d
# Open:   http://localhost:8080
# There is deliberately NO scheduler service: a test copy must never send emails,
# pull mailboxes or run integrations against real customers/services.

x-erp-image: &erp_image
  image: ${ERP_IMAGE:?set ERP_IMAGE in .env to the image copied from the live server}
  pull_policy: never

x-after-configurator: &after_configurator
  depends_on:
    configurator:
      condition: service_completed_successfully

x-backend: &backend
  <<: [*erp_image, *after_configurator]
  volumes:
    - sites:/home/frappe/frappe-bench/sites

services:
  configurator:
    <<: *erp_image
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  backend:
    <<: *backend

  websocket:
    <<: *backend
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]

  queue-short:
    <<: *backend
    command: bench worker --queue short,default

  queue-long:
    <<: *backend
    command: bench worker --queue long,default,short

  frontend:
    <<: *erp_image
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-erp-test.local}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 100m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    ports:
      # Localhost only: this copy holds real customer data and live passwords.
      # Do not change to "8080:8080" (that exposes it to everyone on the network).
      - "127.0.0.1:8080:8080"
    depends_on:
      - backend
      - websocket

  db:
    image: ${MARIADB_IMAGE:-mariadb:10.6}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --password=$$MYSQL_ROOT_PASSWORD || mariadb-admin ping -h localhost --password=$$MYSQL_ROOT_PASSWORD"]
      interval: 2s
      retries: 30
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:6.2-alpine

  redis-queue:
    image: redis:6.2-alpine
    volumes:
      - redis-queue-data:/data

volumes:
  db-data:
  redis-queue-data:
  sites:
